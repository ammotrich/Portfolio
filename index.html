<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AM Portfolio</title>
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dpymwjcbx/image/upload/q_auto/f_auto/v1779756599/Profile_Picture_hev3wz.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
  <style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  :root{
    --k:#000;--w:#fff;--g:#8a8a8a;--lg:#ebebeb;--b:#e0e0e0;
    --pill-bg:#181818;--orange:#ff4d00;
    --fb:'Roboto',system-ui,sans-serif;
    --content-max:1440px;
    --pad-x:clamp(20px,5vw,50px);
    --pad-y:clamp(20px,3vh,40px);
    
    --pill-radius:999px;
    --pill-label-gap:clamp(12px,1.5vw,20px);
    --pill-nav-h:clamp(28px,3.5vw,38px);
    --pill-lang-h:clamp(22px,2.5vw,30px);
    --dot-size:clamp(14px,1.8vw,18px);
    
    --fs-nav:clamp(12px,1vw,14px);
    --fs-lang:clamp(11px,0.9vw,13px);
    
    --fs-name:clamp(2.8rem,5.5vw,6.5rem);
    --fs-body:clamp(1.2rem,1.8vw,2.1rem);
    --fs-contact:clamp(14px,1vw,18px);
    --photo:clamp(100px,11vw,160px);
    --hero-gap:clamp(40px,7vw,100px);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  body{font-family:var(--fb);background:var(--w);color:var(--k);-webkit-font-smoothing:antialiased;overflow-x:hidden}

  .shell{
    min-height:100vh;width:100%;max-width:var(--content-max);
    margin:0 auto;padding:var(--pad-y) var(--pad-x) clamp(48px,8vh,80px);
    display: flex; flex-direction: column;
  }
  .page{animation:pageIn .55s var(--ease) both; flex: 1; display: flex; flex-direction: column;}
  @keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

  /* ——— Header ——— */
  .hdr{
    display:grid;grid-template-columns:1fr auto 1fr;
    align-items:start;gap:16px 24px;
    margin-bottom:clamp(24px,5vh,48px);width:100%;
  }
  .hdr-left{display:flex;align-items:flex-start}
  .hdr-center{display:flex;justify-content:center;min-width:0}
  .hdr-right{display:flex;justify-content:flex-end}

  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    font-size:clamp(16px,1.2vw,20px);font-weight:500;color:var(--k);
    background:rgba(255,255,255,.9);border:none;cursor:pointer;padding:12px 18px;border-radius:999px;
    position:fixed;top:28px;left:28px;z-index:1000;
    transition:opacity .25s var(--ease);
  }
  .back-btn:hover{opacity:.4}
  .back-btn svg{width:20px;height:20px}

  .nav-track,.lang-track{
    display:inline-flex;flex-direction:column;
    align-items:center; 
    gap:var(--pill-label-gap);max-width:100%;
  }
  
  .lang-track{opacity: 0.25; transition: opacity 0.3s var(--ease);}
  .lang-track:hover {opacity: 1;}

  .pill{
    background:var(--pill-bg);border-radius:var(--pill-radius);
    position:relative;height:var(--pill-nav-h);width:100%;
  }
  .lang-track .pill{height:var(--pill-lang-h)}
  
  .pill-dot{
    position:absolute;top:50%;left:0;
    width:var(--dot-size);height:var(--dot-size);
    background:var(--w);border-radius:50%;
    transform:translate(-50%, -50%);
    transition:left .38s var(--ease);
    pointer-events:none;
  }
  
  .nav-row,.lang-row{
    display:grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    justify-items: center; align-items:center;
  }
  .nav-row{ gap:clamp(16px,2.5vw,40px); padding: 0 clamp(40px, 7vw, 100px); }
  .lang-row{ gap:clamp(8px,1.5vw,16px); padding: 0 clamp(16px, 2vw, 24px); }

  .lang-btn,.nav-link{
    font-size:var(--fs-nav);font-weight:500;color:var(--k);
    background:none;border:none;cursor:pointer;padding:0;
    white-space:nowrap;line-height:1.2;font-family:var(--fb);
    transition:color .25s var(--ease),opacity .25s var(--ease);
  }
  .lang-btn { font-size: var(--fs-lang); }
  .lang-btn.dim,.nav-link.dim{color:var(--g);font-weight:500}
  .nav-link:hover,.lang-btn:hover{color:var(--k)}
  .lang-btn.dim:hover,.nav-link.dim:hover{opacity:.5}

  .about-viewport {
    display: flex; flex-direction: column;
    min-height: calc(100vh - clamp(100px, 20vh, 180px));
  }
  .about-hero{
    display:grid;grid-template-columns:var(--photo) minmax(0,1fr);
    align-items:start;gap:var(--hero-gap);
    margin-top:clamp(80px, 16vh, 160px); margin-bottom: 40px;
  }
  .about-photo-wrap{flex-shrink:0; padding-top:8px;}
  .about-photo{
    width:100%;height:auto;aspect-ratio:1/1;
    object-fit:cover;object-position:top center;display:block;
    transition:transform .5s var(--ease);
  }
  .about-photo-wrap:hover .about-photo{transform:scale(1.02)}
  .about-ph{width:100%;aspect-ratio:1/1;background:#d8d8d8;display:block;}
  .about-info{min-width:0; padding-top:0;}
  .about-name{
    font-size:var(--fs-name);font-weight:500;line-height:1;
    letter-spacing:-0.04em;margin-bottom:clamp(20px,3vh,36px);
  }
  .about-bio{
    font-size:var(--fs-body);line-height:1.35;font-weight:400;
    letter-spacing:-0.03em;max-width:32em;color:var(--k); white-space:pre-wrap;
  }

  .about-contacts { margin-top: auto; padding-bottom: 24px; }
  .about-contacts h3 {
    font-size: var(--fs-contact); font-weight: 600;
    margin-bottom: 20px; letter-spacing:-0.02em;
  }
  .contacts-links { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 24px; }
  .links-group { display: flex; gap: clamp(24px, 4vw, 48px); }
  .contacts-links a {
    font-size: var(--fs-contact); font-weight: 400;
    color: var(--k); text-decoration: underline;
    text-underline-offset: 4px; transition: opacity .25s var(--ease);
  }
  .contacts-links a:hover { opacity: .4; }
  .contacts-links a.muted { color: var(--g); pointer-events: none; }

  .next-cases {
    margin-top: clamp(80px, 12vh, 160px);
    padding-top: clamp(40px, 6vh, 60px);
    border-top: 1px solid var(--lg);
  }
  .next-cases-title {
    font-size: clamp(1.4rem, 2.5vw, 2rem);
    font-weight: 500; letter-spacing: -0.03em; margin-bottom: 32px;
  }
  .next-cases-grid {
    display: grid; grid-template-columns: repeat(4, minmax(0, 260px)); gap: 14px;
  }
  .next-card {
    background: var(--lg); border-radius: 14px; overflow: hidden;
    aspect-ratio: 3/2; cursor: pointer; position: relative;
    transition: transform .4s var(--ease), box-shadow .4s var(--ease);
  }
  .next-card:hover { transform: translateY(-5px); box-shadow: 0 10px 28px rgba(0,0,0,0.08); }
  .next-card img { width: 100%; height: 100%; object-fit: cover; }
  .next-card-title {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,.45));
    color: #fff; font-size: .82rem; font-weight: 400;
  }
  .next-card-ph {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 1rem; font-weight: 500; color: #c0c0c0; text-align: center; padding: 16px;
  }

  .case-page-wrap { width:100%; }
  .case-page{
    display:flex; justify-content:center; position:relative; width:100%; margin:0 auto;
  }
  
  .case-side-wrap{
    position:absolute; left:0; top:0; bottom:0;
    width:clamp(140px, 15vw, 220px); pointer-events:none;
  }
  .case-side{
    position:sticky; top:50vh; transform:translateY(-50%); pointer-events:auto;
  }
  
  .case-side-nav{list-style:none;display:flex;flex-direction:column;gap:8px}
  .case-side-nav li{
    font-size:clamp(0.7rem, 0.8vw, 0.85rem); color:var(--g);cursor:pointer;
    padding:4px 0;transition:color .2s;line-height:1.45;
  }
  .case-side-nav li:hover{color:var(--k)}
  .case-side-nav li.act{color:var(--k);font-weight:500}
  
  .case-main{ width:100%; max-width:960px; }

  /* Карточки внутри категорий */
  .cat-item { cursor: pointer; transition: transform .4s var(--ease); }
  .cat-item:hover .pw-card { transform: translateY(-4px); }
  .pw-card { transition: transform .4s var(--ease); }

  /* Специфичная карточка ProWork */
  .pw-card{
    position:relative;background:var(--lg); border-radius:24px;
    overflow:hidden; aspect-ratio:5/4; min-height:300px;
  }
  .pw-meta{
    position:absolute;top:22px;left:28px;right:28px;
    display:flex;justify-content:space-between;
    font-size:.72rem;color:#b0b0b0;font-weight:400;z-index:2;
  }
  .pw-bg-title{
    position:absolute;left:50%;top:50%; transform:translate(-50%,-52%);
    font-size:clamp(4rem,14vw,9rem); font-weight:700;color:#d4d4d4;
    white-space:nowrap; line-height:1;z-index:1;user-select:none;
  }
  .pw-star{
    position:absolute; top:calc(50% - clamp(3.5rem,10vw,6.5rem));
    left:calc(50% + clamp(5rem,18vw,11rem)); color:var(--orange);font-size:1.1rem;z-index:2;
  }
  .pw-shapes{position:absolute;inset:0;z-index:1;pointer-events:none}
  .pw-shape{ position:absolute;border-radius:999px; border:1.5px solid transparent; }
  .pw-shape.s1{width:120px;height:48px;top:18%;left:8%;border-color:#d8d8d8;transform:rotate(-12deg)}
  .pw-shape.s2{width:90px;height:36px;top:55%;left:12%;border-color:var(--orange);transform:rotate(8deg)}
  .pw-shape.s3{width:70px;height:28px;top:30%;right:18%;border-color:#d0d0d0;transform:rotate(15deg)}
  .pw-shape.s4{width:100px;height:40px;bottom:22%;right:10%;border-color:var(--orange);transform:rotate(-8deg)}

  .pw-mockup{
    position:absolute;left:50%;top:50%; transform:translate(-50%,-48%);
    z-index:3;width:clamp(160px,24vw,240px);height:clamp(280px,38vw,420px);
    background:#ddd;border-radius:24px; display:flex;align-items:center;justify-content:center;
    font-size:.72rem;color:#999;text-align:center;padding:16px;
  }
  .pw-bottom{
    position:absolute;bottom:24px;left:28px;right:28px;
    display:flex;justify-content:space-between;align-items:flex-end; z-index:4;
  }
  .pw-desc{font-size:.78rem;color:var(--g);line-height:1.45;max-width:240px}
  .pw-app-tag{
    display:inline-block;border:1.5px solid var(--orange);
    color:var(--k);font-size:.72rem;font-weight:500;
    padding:2px 8px;margin-bottom:6px;border-radius:2px;
  }
  .pw-tag{color:var(--orange);font-size:.82rem;font-weight:600}

  .empty-msg{font-size:.85rem;color:var(--g);padding:8px 0}

  .adm{min-height:100vh;padding:36px 44px;background:#f7f7f7;font-family:var(--fb)}
  .adm-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px;flex-wrap:wrap;gap:16px}
  .adm-title{font-size:1.6rem;font-weight:700}
  .adm-actions{display:flex;gap:10px;flex-wrap:wrap}
  .btn{font-size:.72rem;font-weight:500;letter-spacing:.04em;
    padding:9px 18px;border:1px solid var(--k);background:transparent;
    cursor:pointer;transition:all .2s;color:var(--k);border-radius:999px}
  .btn:hover{background:var(--k);color:#fff}
  .btn.pr{background:var(--k);color:#fff}
  .btn.pr:hover{opacity:.8}
  .btn.dg{border-color:#c00;color:#c00}
  .btn.dg:hover{background:#c00;color:#fff}
  .btn.sm{padding:6px 14px;font-size:.68rem}
  .adm-card{background:#fff;padding:16px 20px;margin-bottom:8px;
    border-radius:12px;display:flex;align-items:center;gap:16px}
  .adm-thumb{width:88px;height:58px;object-fit:cover;border-radius:6px;background:var(--lg)}
  .adm-thumb-ph{width:88px;height:58px;background:var(--lg);border-radius:6px;
    display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#bbb}
  .adm-card-info{flex:1}
  .adm-card-t{font-size:.9rem;font-weight:600}
  .adm-card-m{font-size:.75rem;color:var(--g);margin-top:2px}
  .adm-card-acts{display:flex;gap:8px}
  .adm-section{background:#fff;padding:24px;margin-bottom:12px;border-radius:12px}
  .adm-section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px}
  .adm-sec-title{font-size:1.1rem;font-weight:600}
  .adm-g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fg{margin-bottom:16px}
  .fl{display:block;font-size:.68rem;font-weight:500;color:var(--g);margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}
  .fi{width:100%;padding:10px 12px;border:1px solid var(--b);font-family:var(--fb);
    font-size:.88rem;background:#fff;outline:none;border-radius:8px;transition:border-color .2s}
  .fi:focus{border-color:var(--k)}
  textarea.fi{min-height:100px;resize:vertical}
  select.fi{cursor:pointer}
  .ch-edit{background:#f5f5f5;padding:16px;margin-bottom:8px;border-radius:10px; border:1px solid #eaeaea;}
  .ch-edit-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .ch-edit-num{font-weight:600;font-size:.9rem; text-transform: uppercase; letter-spacing: 0.05em;}
  
  .info-bar{background:#fff;border-left:3px solid var(--k);padding:10px 14px;
    font-size:.78rem;color:var(--g);margin-bottom:20px;border-radius:0 8px 8px 0}
  .info-bar strong{color:var(--k)}
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5}
  .login-box{background:#fff;padding:40px;width:340px;border-radius:16px}
  .login-title{font-size:1.5rem;font-weight:700;margin-bottom:6px}
  .login-sub{font-size:.8rem;color:var(--g);margin-bottom:28px;line-height:1.5}
  .login-err{color:#c00;font-size:.78rem;margin-top:6px}

  .adm-link{
    position:fixed;bottom:16px;right:16px;
    font-size:.65rem;color:var(--g);background:none;border:none;
    cursor:pointer;opacity:0;transition:opacity .3s;z-index:50;
  }
  .adm-link:hover{opacity:1 !important;color:var(--k)}
  body:hover .adm-link{opacity:.35}

  @media(max-width:1024px){
    :root{--nav-gap:clamp(12px,2vw,24px)}
  }
  .vibe-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
  @media(max-width:768px){
    .hdr{
      grid-template-columns:1fr;justify-items:center;text-align:center;
      gap:24px;margin-bottom:40px;
    }
    .hdr-left,.hdr-right,.hdr-center{width:100%;justify-content:center}
    .hdr-left{order:2}.hdr-center{order:1}.hdr-right{order:3}
    
    .nav-row{padding: 0 clamp(28px, 6vw, 48px);}
    .lang-row{padding: 0 clamp(16px, 4vw, 24px);}
    
    .about-hero{ grid-template-columns:1fr; margin-top:24px; gap:32px; }
    .about-photo-wrap { max-width: 240px; margin: 0 auto; }
    .about-info { display: flex; flex-direction: column; align-items: flex-start; text-align: left; }
    .contacts-links { flex-direction: column; gap: 16px; justify-content: flex-start; }
    .links-group { gap: 24px; }
    .about-contacts { padding-left: 0 !important; }

    .case-page{flex-direction:column;gap:28px}
    .case-side-wrap{position:static;width:100%;height:auto}
    .case-side{position:static;transform:none}
    .case-side-nav{flex-direction:row;flex-wrap:wrap;gap:12px 20px}
    .pw-card{min-height:240px;border-radius:20px}
    .pw-meta{font-size:.65rem;top:14px;left:16px;right:16px}
    .pw-bottom{left:16px;right:16px;bottom:16px}
    .adm{padding:20px}
    .adm-g2{grid-template-columns:1fr}
    /* Vibe page */
    .vibe-grid{grid-template-columns:1fr !important;gap:28px !important}
    .vibe-section-wrap{padding:40px 20px 0 !important}
  }
</style>
</head>

const storage = {
  async get(key) {
    if (window.storage?.get) {
      try { return await window.storage.get(key); } catch { /* fallback */ }
    }
    const v = localStorage.getItem(key);
    return v ? { value: v } : null;
  },
  async set(key, value) {
    if (window.storage?.set) {
      try { await window.storage.set(key, value); return; } catch { /* fallback */ }
    }
    localStorage.setItem(key, value);
  },
};

function useScrollSpy(ids) {
  const [active, setActive] = useState(ids[0] || "");
  useEffect(() => {
    if (!ids.length) return;
    const obs = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) setActive(e.target.dataset.chid);
        });
      },
      { rootMargin: "-15% 0px -70% 0px" }
    );
    ids.forEach((id) => {
      const el = document.querySelector(`[data-chid="${id}"]`);
      if (el) obs.observe(el);
    });
    return () => obs.disconnect();
  }, [ids.join(",")]);
  return [active, setActive];
}

function Header({ pg, navigate, lang, setLang, showBack, onBack }) {
  const navTrackRef = useRef(null); const navPillRef = useRef(null); const navRowRef = useRef(null);
  const langTrackRef = useRef(null); const langPillRef = useRef(null); const langRowRef = useRef(null);
  const linkRefs = useRef([]); const langRefs = useRef([]);
  const [navDot, setNavDot] = useState(0); const [langDot, setLangDot] = useState(0);

  const syncIndicators = () => {
    const pill = navPillRef.current; const row = navRowRef.current;
    const idx = NAV.findIndex(([p]) => p === pg);
    const btn = linkRefs.current[idx];
    if (pill && btn && row) {
      pill.style.width = `${row.offsetWidth}px`;
      const pr = pill.getBoundingClientRect(); const br = btn.getBoundingClientRect();
      setNavDot(br.left - pr.left + br.width / 2);
    }
    const lPill = langPillRef.current; const lRow = langRowRef.current;
    const lBtn = langRefs.current[lang === "ru" ? 0 : 1];
    if (lPill && lBtn && lRow) {
      lPill.style.width = `${lRow.offsetWidth}px`;
      const pr = lPill.getBoundingClientRect(); const br = lBtn.getBoundingClientRect();
      setLangDot(br.left - pr.left + br.width / 2);
    }
  };

  useEffect(() => {
    syncIndicators();
    let raf = requestAnimationFrame(syncIndicators);
    const t1 = setTimeout(syncIndicators, 80);
    const handleObserver = () => { raf = requestAnimationFrame(syncIndicators); };
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(handleObserver) : null;
    [navTrackRef, langTrackRef].forEach((r) => { if (ro && r.current) ro.observe(r.current); });
    window.addEventListener("resize", handleObserver);
    return () => {
      cancelAnimationFrame(raf); clearTimeout(t1);
      ro?.disconnect(); window.removeEventListener("resize", handleObserver);
    };
  }, [pg, lang]);

  return (
    <header className="hdr">
      <div className="hdr-left">
        {showBack && (
          <button className="back-btn" onClick={onBack}>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6" /></svg> Назад
          </button>
        )}
      </div>
      <div className="hdr-center">
        <div className="nav-track" ref={navTrackRef}>
          <div className="pill" ref={navPillRef} style={{cursor:"pointer"}} onClick={(e)=>{
              const row=navRowRef.current; if(!row) return;
              const btns=Array.from(row.querySelectorAll("button"));
              const x=e.clientX; let best=btns[0], bd=Infinity;
              btns.forEach(b=>{const r=b.getBoundingClientRect(),d=Math.abs(r.left+r.width/2-x);if(d<bd){bd=d;best=b;}});
              best.click();
            }}><span className="pill-dot" style={{ left: navDot }} /></div>
          <nav className="nav-row" ref={navRowRef}>
            {NAV.map(([p, label], i) => (
              <button key={p} ref={(el) => { linkRefs.current[i] = el; }} className={`nav-link${pg === p ? " act" : " dim"}`} onClick={() => navigate(p)}>{label}</button>
            ))}
          </nav>
        </div>
      </div>
      <div className="hdr-right"></div>
    </header>
  );
}

function CasePage({ caseData, cases, about, navigate }) {
  // Нормализуем данные: если есть chapters, но нет blocks, используем chapters для рендера (обратная совместимость)
  const blocks = caseData.blocks || [];
  const chapters = caseData.chapters || [];
  const useBlocks = blocks.length > 0;
  
  const headings = blocks.filter(b => b.type === "heading");
  const chIds = useBlocks ? headings.map(h => h.id) : chapters.map((c) => c.id);
  const [active, setActive] = useScrollSpy(chIds);

  const scrollTo = (id) => {
    const el = document.querySelector(`[data-chid="${id}"]`);
    if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); setActive(id); }
  };

  const isYT = (url) => url.includes("youtube.com") || url.includes("youtu.be");
  const ytSrc = (url) => { const m = url.match(/(?:v=|youtu\.be\/)([^&?]+)/); return m ? `https://www.youtube.com/embed/${m[1]}` : url; };

  return (
    <div className="page case-page-wrap">
      <div className="case-page">
        <div className="case-side-wrap">
          <aside className="case-side">
            <ul className="case-side-nav">
              {useBlocks
                ? headings.map((h) => <li key={h.id} className={active === h.id ? "act" : ""} onClick={() => scrollTo(h.id)}>{h.content}</li>)
                : chapters.map((ch) => <li key={ch.id} className={active === ch.id ? "act" : ""} onClick={() => scrollTo(ch.id)}>{ch.navTitle || ch.title}</li>)
              }
            </ul>
          </aside>
        </div>

        <div className="case-main">
          {caseData.coverImage && (
            <img src={caseData.coverImage} alt={caseData.title} style={{width:"100%",display:"block",marginBottom:0,maxHeight:"80vh",objectFit:"cover",borderRadius:12}} />
          )}
          <h1 style={{fontSize:"clamp(2rem,4vw,3.8rem)",fontWeight:500,letterSpacing:"-0.04em",lineHeight:1.05,marginTop:28,marginBottom:6}}>{caseData.title}</h1>
          {(caseData.tags && caseData.tags.length > 0) && (
            <div style={{fontSize:".72rem",color:"var(--g)",letterSpacing:".06em",textTransform:"uppercase",marginBottom:44}}>
              {[...caseData.tags, caseData.year].filter(Boolean).join(" · ")}
            </div>
          )}
          <div>
            {useBlocks ? blocks.map((b) => {
              if (b.type === "heading") return <h2 key={b.id} id={"ch-" + b.id} data-chid={b.id} style={{fontSize:"clamp(1.6rem,3vw,2.6rem)",fontWeight:500,letterSpacing:"-0.03em",lineHeight:1.1,marginTop:56,marginBottom:20,scrollMarginTop:100}}>{b.content}</h2>;
              if (b.type === "text") return <p key={b.id} style={{fontSize:"clamp(.95rem,1.2vw,1.1rem)",lineHeight:1.78,maxWidth:640,whiteSpace:"pre-wrap",marginBottom:32,color:"var(--k)"}}>{b.content}</p>;
              if (b.type === "image") return b.url ? <img key={b.id} src={b.url} alt="" style={{width:"100%",display:"block",marginBottom:6,borderRadius:8}} /> : null;
              if (b.type === "video") return b.url ? <div key={b.id} style={{marginBottom:6}}>{isYT(b.url) ? <iframe src={ytSrc(b.url)} allowFullScreen style={{width:"100%",aspectRatio:"16/9",border:"none",display:"block",borderRadius:8}} /> : <video src={b.url} controls style={{width:"100%",borderRadius:8}} />}</div> : null;

      <div className="adm-section">
        <div className="adm-section-hdr"><div className="adm-sec-title">{label}</div><button className="btn sm pr" onClick={() => newCase(cat)}>+ Добавить</button></div>
        {list.length === 0 ? <div style={{ color: "var(--g)", fontSize: ".82rem" }}>Нет проектов</div> : list.map((c) => (
          <div key={c.id} className="adm-card">
            {c.coverImage ? <img className="adm-thumb" src={c.coverImage} alt={c.title} /> : <div className="adm-thumb-ph">—</div>}
            <div className="adm-card-info">
              <div className="adm-card-t">{c.title}</div>
              <div className="adm-card-m">{[...(c.tags || []), c.year].filter(Boolean).join(" · ")}</div>
            </div>
            <div className="adm-card-acts">
              <button className="btn sm" onClick={() => { setEditCase(c); setAdminPg("edit"); }}>Изменить</button>
              <button className="btn sm dg" onClick={() => del(c.id)}>Удалить</button>
            </div>
          </div>
        ))}
      </div>
    );
  };

  return (
    <div className="adm">
      <div className="adm-hdr">
        <div className="adm-title">Панель управления</div>
        <div className="adm-actions">
          <button className="btn" onClick={() => setAdminPg("about")}>Профиль</button>
          <button className="btn" onClick={() => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([JSON.stringify({about, cases}, null, 2)], {type:"application/json"}));
            a.download = "portfolio-export.json"; a.click();
          }}>Экспорт JSON ↓</button>
          <button className="btn pr" onClick={() => navigate("about")}>← На сайт</button>
        </div>
      </div>
      <div className="info-bar">Пароль: <strong>{PASS}</strong></div>
      <Section label="UI/UX" cat="uiux" />
      <Section label="Branding" cat="branding" />
      <Section label="Вайб" cat="fun" />
    </div>
  );
}

function EditCase({ ec, cases, saveCases, setAdminPg }) {
  const [f, setF] = useState(() => {
    // Конвертация старых chapters в blocks для обратной совместимости
    let initialBlocks = ec.blocks || [];
    if (initialBlocks.length === 0 && ec.chapters && ec.chapters.length > 0) {
      ec.chapters.forEach(ch => {
        if (ch.title) initialBlocks.push({ id: `h_${Date.now()}_${Math.random()}`, type: 'heading', content: ch.title });
        if (ch.text) initialBlocks.push({ id: `t_${Date.now()}_${Math.random()}`, type: 'text', content: ch.text });
        if (ch.media && ch.media.length) {
          ch.media.forEach(m => {
            initialBlocks.push({ id: `m_${Date.now()}_${Math.random()}`, type: m.type, url: m.url });
          });
        }
      });
    }
    return { ...ec, tags: ec.tags || [], blocks: initialBlocks };
  });
  
  const [tagStr, setTagStr] = useState((ec.tags || []).join(", "));
  const upd = (k, v) => setF((p) => ({ ...p, [k]: v }));

  // Управление блоками
  const addBlock = (type) => {
    upd('blocks', [...f.blocks, { id: Date.now().toString(), type, content: '', url: '' }]);
  };
  const updBlock = (id, field, val) => {
    upd('blocks', f.blocks.map(b => b.id === id ? { ...b, [field]: val } : b));
  };
  const delBlock = (id) => {
    if (window.confirm("Удалить блок?")) upd('blocks', f.blocks.filter(b => b.id !== id));
  };
  const moveBlock = (idx, dir) => {
    const newBlocks = [...f.blocks];
    const temp = newBlocks[idx];
    newBlocks[idx] = newBlocks[idx + dir];
    newBlocks[idx + dir] = temp;
    upd('blocks', newBlocks);
  };

  const save = () => {
    const toSave = {
      ...f,
      tags: tagStr.split(",").map((t) => t.trim()).filter(Boolean),
      chapters: [] // Очищаем старые разделы, так как теперь используются блоки
    };
    const exists = cases.find((c) => c.id === toSave.id);
    saveCases(exists ? cases.map((c) => (c.id === toSave.id ? toSave : c)) : [...cases, toSave]);
    setAdminPg("dashboard");
  };

  return (
    <div className="adm">
      <div className="adm-hdr">
        <div className="adm-title">{ec.title === "Новый проект" ? "Новый проект" : `Редактировать: ${f.title}`}</div>
        <div className="adm-actions">
          <button className="btn" onClick={() => setAdminPg("dashboard")}>Отмена</button>
          <button className="btn pr" onClick={save}>Сохранить</button>
        </div>
      </div>
      
      <div className="adm-section">
        <div className="adm-sec-title" style={{ marginBottom: 16 }}>Основная информация</div>
        <div className="adm-g2">
          <div className="fg"><label className="fl">Название</label><input className="fi" value={f.title} onChange={(e) => upd("title", e.target.value)} /></div>
          <div className="fg"><label className="fl">Короткое название (в меню)</label><input className="fi" value={f.shortTitle || ""} onChange={(e) => upd("shortTitle", e.target.value)} placeholder="ПроВорк" /></div>
          <div className="fg"><label className="fl">Категория</label><select className="fi" value={f.category} onChange={(e) => upd("category", e.target.value)}><option value="uiux">UI/UX</option><option value="branding">Branding</option><option value="fun">Вайб</option></select></div>
          <div className="fg"><label className="fl">Теги (через запятую)</label><input className="fi" value={tagStr} onChange={(e) => setTagStr(e.target.value)} /></div>
        </div>
        <div className="fg"><label className="fl">Обложка — URL</label><input className="fi" value={f.coverImage} onChange={(e) => upd("coverImage", e.target.value)} placeholder="https://..." /></div>
      </div>

      <div className="adm-section">
        <div className="adm-section-hdr">
          <div className="adm-sec-title">Содержимое кейса</div>
          <div style={{display:"flex", gap: "8px", flexWrap: "wrap"}}>
            <button className="btn sm pr" onClick={() => addBlock("heading")}>+ Заголовок</button>
            <button className="btn sm pr" onClick={() => addBlock("text")}>+ Текст</button>
            <button className="btn sm pr" onClick={() => addBlock("image")}>+ Фото</button>
            <button className="btn sm pr" onClick={() => addBlock("video")}>+ Видео</button>
          </div>
        </div>
        
        {f.blocks.map((b, idx) => (
          <div key={b.id} className="ch-edit">
            <div className="ch-edit-hdr">
              <span className="ch-edit-num">
                {b.type === 'heading' ? 'Заголовок' : b.type === 'text' ? 'Текст' : b.type === 'image' ? 'Изображение' : 'Видео'}
              </span>
              <div style={{display:"flex",gap:4}}>
                <button className="btn sm" onClick={() => moveBlock(idx, -1)} disabled={idx===0}>↑</button>
                <button className="btn sm" onClick={() => moveBlock(idx, 1)} disabled={idx===f.blocks.length-1}>↓</button>
                <button className="btn sm dg" onClick={() => delBlock(b.id)}>✕</button>
              </div>
            </div>

            {b.type === 'heading' && (
               <input className="fi" value={b.content} onChange={(e) => updBlock(b.id, 'content', e.target.value)} placeholder="Введите заголовок..." />
            )}
            {b.type === 'text' && (
               <textarea className="fi" value={b.content} onChange={(e) => updBlock(b.id, 'content', e.target.value)} placeholder="Введите текст..." />
            )}
            {(b.type === 'image' || b.type === 'video') && (
               <input className="fi" value={b.url} onChange={(e) => updBlock(b.id, 'url', e.target.value)} placeholder="URL медиафайла (https://...)" />
            )}
          </div>
        ))}
        {f.blocks.length === 0 && <p className="empty-msg">Добавьте блоки контента (Заголовок, фото, текст...)</p>}
      </div>
    </div>
  );
}

function EditAbout({ about, saveAbout, setAdminPg }) {
  const [f, setF] = useState({ ...about, contacts: { ...about.contacts } });
  const upd = (k, v) => setF((p) => ({ ...p, [k]: v }));
  const updC = (k, v) => setF((p) => ({ ...p, contacts: { ...p.contacts, [k]: v } }));
  const save = () => { saveAbout(f); setAdminPg("dashboard"); };

  return (
    <div className="adm">
      <div className="adm-hdr">
        <div className="adm-title">Редактировать профиль</div>
        <div className="adm-actions"><button className="btn" onClick={() => setAdminPg("dashboard")}>Отмена</button><button className="btn pr" onClick={save}>Сохранить</button></div>
      </div>
      <div className="adm-section">
        <div className="adm-g2"><div className="fg"><label className="fl">Имя</label><input className="fi" value={f.name} onChange={(e) => upd("name", e.target.value)} /></div></div>
        <div className="fg"><label className="fl">Фото — URL</label><input className="fi" value={f.photo} onChange={(e) => upd("photo", e.target.value)} /></div>
        <div className="fg"><label className="fl">О себе</label><textarea className="fi" value={f.bio} onChange={(e) => upd("bio", e.target.value)} style={{ minHeight: 140 }} /></div>
      </div>
      <div className="adm-section">
        <div className="adm-sec-title" style={{ marginBottom: 16 }}>Контакты</div>
        {[["email", "Почта"], ["telegram", "Telegram"], ["behance", "Behance"], ["dprofile", "Dprofile"]].map(([k, lbl]) => (
          <div key={k} className="fg"><label className="fl">{lbl}</label><input className="fi" value={f.contacts[k] || ""} onChange={(e) => updC(k, e.target.value)} /></div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [pg, setPg] = useState("about");
  const [caseId, setCaseId] = useState(null);
  const [cases, setCases] = useState([]);
  const [about, setAbout] = useState(DEFAULT_ABOUT);
  const [loaded, setLoaded] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [adminPg, setAdminPg] = useState("dashboard");
  const [editCase, setEditCase] = useState(null);
  const [lang, setLang] = useState("ru");

  useEffect(() => {
    (async () => {
      try {
        const r = await storage.get("pf_cases_v3");
        const parsed = r ? JSON.parse(r.value) : null;
        setCases(parsed?.length ? parsed : DEFAULT_CASES);
      } catch { setCases(DEFAULT_CASES); }
      
      try {
        const r = await storage.get("pf_about_v3");
        if (r) setAbout(JSON.parse(r.value));
      } catch { /* defaults */ }
      setLoaded(true);
    })();
  }, []);

  const saveCases = async (nc) => {
    setCases(nc);
    try { await storage.set("pf_cases_v3", JSON.stringify(nc)); } catch { /* noop */ }
  };
  const saveAbout = async (na) => {
    setAbout(na);
    try { await storage.set("pf_about_v3", JSON.stringify(na)); } catch { /* noop */ }
  };

  const navigate = (p, id = null) => {
    setPg(p);
    if (id) setCaseId(id); else if (p !== "case") setCaseId(null);
    window.scrollTo(0, 0);
  };

  const goAdmin = () => { setPg("admin"); setAdminPg("dashboard"); };

  const currentCase = cases.find((c) => c.id === caseId);
  const showBack = pg === "case" && currentCase;

  if (!loaded) return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Roboto,sans-serif",color:"#ccc"}}>···</div>;

  if (pg === "admin") {
    if (!isAdmin) return <AdminLogin onLogin={() => setIsAdmin(true)} />;
    if (adminPg === "edit" && editCase) return <EditCase ec={editCase} cases={cases} saveCases={saveCases} setAdminPg={setAdminPg} />;
    if (adminPg === "about") return <EditAbout about={about} saveAbout={saveAbout} setAdminPg={setAdminPg} />;
    return <AdminDashboard about={about} cases={cases} saveCases={saveCases} setEditCase={setEditCase} setAdminPg={setAdminPg} navigate={navigate} />;
  }

  return (
    <>
      <div className="shell">
        <Header pg={pg === "case" ? currentCase?.category || "uiux" : pg} navigate={navigate} lang={lang} setLang={setLang} showBack={showBack} onBack={() => navigate(currentCase?.category || "uiux")} />
        {pg === "about" && <AboutPage about={about} cases={cases} navigate={navigate} />}
        {pg === "uiux" && <CategoryView cases={cases} about={about} navigate={navigate} category="uiux" />}
        {pg === "branding" && <CategoryView cases={cases} about={about} navigate={navigate} category="branding" />}
        {pg === "fun" && <FunPage cases={cases} about={about} navigate={navigate} />}
        {pg === "case" && currentCase && <CasePage caseData={currentCase} cases={cases} about={about} navigate={navigate} />}
      </div>
      <button className="adm-link" onClick={goAdmin}>admin</button>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
